name: obywatel_plus
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pin_code_fields: ^8.0.1
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.0
  logger: ^2.6.2
  go_router: ^17.0.1
  local_auth: ^3.0.0
  advertising_id: ^2.7.1
  device_info_plus: ^12.2.0
  uuid: ^4.5.1
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  collection: ^1.19.1
  flutter_spinkit: ^5.2.2
  equatable: ^2.0.7
  libsignal_protocol_dart: ^0.8.2
  web_socket_channel: ^3.0.3
  file_picker: ^10.3.6
  image_picker: ^1.2.1
  video_compress: ^3.1.4
  isolate_manager: ^6.1.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  easy_localization: ^3.0.8
  mobile_scanner: ^7.4.0

  socket_io_client: ^3.1.3
  mime: ^2.0.0
  path_provider: ^2.1.5
  flutter_webrtc: ^1.2.1
  flutter_background: ^1.3.0+1
  workmanager: ^0.9.0+3

  flutter_launcher_icons: "^0.14.4"
  url_launcher: ^6.3.2
  drift: ^2.35.2
  drift_flutter: ^0.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  flutter_root_jailbreak_checker: ^2.1.5
  flutter_native_splash: ^2.4.7
  crypto: ^3.0.7
  path: ^1.9.1
  vibration: ^3.1.3
  riverpod_annotation: ^4.0.0
  action_slider: ^0.7.0
  ffi: ^2.1.4
  device_marketing_names: ^1.1.6
  fresh_dio: 0.4.4
  secure_application: ^4.1.0
  connectivity_plus: ^7.3.1
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  mocktail: ^1.0.4
  freezed: ^4.0.2
  json_serializable: ^6.11.2
  flutter_gen_runner: ^5.13.0+1
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/translations/
    - assets/keys/

flutter_native_splash:
  color: "#000000"
  image: assets/splash/logo.png

  android_12:
    color: "#000000"
    image: assets/splash/logo.png

  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_gen:
  output: lib/app/config/generated/
  line_length: 80

  integrations:
    flutter_svg: true
